<!DOCTYPE html>
<html>
<head>
    <title>Smart City Reports - SPA</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 0; }
        .navbar { background: #333; color: white; padding: 10px; }
        .navbar a { color: white; text-decoration: none; margin: 0 15px; padding: 10px; }
        .navbar a:hover { background: #555; }
        #content { padding: 20px; }
        .search-box { margin: 20px 0; }
        #searchInput { width: 100%; padding: 10px; font-size: 16px; }
        #reportList { margin-top: 20px; }
        .report-item { border: 1px solid #ddd; padding: 10px; margin: 10px 0; cursor: pointer; }
        .report-item:hover { background: #f5f5f5; }
        .badge { padding: 3px 8px; border-radius: 5px; color: white; }
        .badge-REPORTED { background: red; }
        .badge-RESOLVED { background: green; }
        .badge-VERIFIED { background: orange; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        #modalBody { background: white; margin: 10% auto; padding: 20px; width: 80%; max-width: 500px; border-radius: 10px; }
        .close-btn { float: right; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="#" class="nav-link" data-url="/dashboard/">Dashboard</a>
        <a href="#" class="nav-link" data-url="/">Daftar Laporan</a>
        <a href="#" class="nav-link" data-url="/add/">Tambah Laporan</a>
    </div>

    <!-- Content Container -->
    <div id="content">
        <!-- Initial content will be loaded here -->
    </div>

    <!-- Modal for Detail -->
    <div id="modal">
        <div id="modalBody">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Detail Laporan</h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // SPA Navigation
        document.addEventListener('DOMContentLoaded', function() {
            // Load initial page
            loadPage('/');

            // Handle navbar clicks
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const url = this.getAttribute('data-url');
                    loadPage(url);
                });
            });
        });

        function loadPage(url) {
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    // Extract body content (simple way)
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const bodyContent = doc.body.innerHTML;
                    document.getElementById('content').innerHTML = bodyContent;

                    // Re-initialize search if on report list page
                    if (url === '/' || url.includes('report_list')) {
                        initSearch();
                    }
                })
                .catch(err => console.error('Error loading page:', err));
        }

        // Search functionality
        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            const reportList = document.getElementById('reportList');

            if (!searchInput || !reportList) return;

            let debounceTimer;
            searchInput.addEventListener('input', function(e) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    const query = e.target.value.trim();
                    if (query.length >= 2) {
                        fetch(`/api/search/?q=${encodeURIComponent(query)}`)
                            .then(res => res.json())
                            .then(data => {
                                if (data.length > 0) {
                                    let html = '';
                                    data.forEach(item => {
                                        const badgeClass = item.status === 'RESOLVED' ? 'badge-RESOLVED' : (item.status === 'VERIFIED' ? 'badge-VERIFIED' : 'badge-REPORTED');
                                        html += `<div class="report-item" onclick="openDetail(${item.id})">
                                            <strong>${item.title}</strong><br>
                                            <small>${item.category} | ${item.location} | <span class="badge ${badgeClass}">${item.status}</span></small>
                                        </div>`;
                                    });
                                    reportList.innerHTML = html;
                                } else {
                                    reportList.innerHTML = '<p>Tidak ada hasil</p>';
                                }
                            })
                            .catch(err => console.error('Search error:', err));
                    } else {
                        // Load original list
                        loadPage('/');
                    }
                }, 300);
            });
        }

        // Modal functions
        function openDetail(id) {
            fetch(`/api/report/${id}/`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error);
                    } else {
                        const badgeClass = data.status === 'RESOLVED' ? 'badge-RESOLVED' : (data.status === 'VERIFIED' ? 'badge-VERIFIED' : 'badge-REPORTED');
                        document.getElementById('modalContent').innerHTML = `
                            <p><strong>Judul:</strong> ${data.title}</p>
                            <p><strong>Kategori:</strong> ${data.category}</p>
                            <p><strong>Lokasi:</strong> ${data.location}</p>
                            <p><strong>Status:</strong> <span class="badge ${badgeClass}">${data.status}</span></p>
                            <p><strong>Deskripsi:</strong></p>
                            <p style="background: #f5f5f5; padding: 10px; border-radius: 5px;">${data.description}</p>
                        `;
                        document.getElementById('modal').style.display = 'block';
                    }
                })
                .catch(err => console.error('Detail error:', err));
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Close modal when clicking outside
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>

</body>
</html>
