{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-lg" style="border-radius: 24px; overflow: hidden;">
                <div class="p-4 text-white" style="background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);">
                    <div class="mb-3">
                        <i class="bi bi-pencil-square fs-1"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Edit Laporan</h2>
                    <p class="mb-0 opacity-75">Perbarui informasi laporan sesuai kebutuhan.</p>
                </div>
                <div class="p-5 bg-white">
                    <form method="post" onsubmit="this.querySelector('button[type=submit]').innerText='Loading...'; this.querySelector('button[type=submit]').disabled=true;">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Judul Laporan</label>
                            <div class="input-group rounded-4 overflow-hidden shadow-sm">
                                <span class="input-group-text bg-white border-0"><i class="bi bi-file-text text-warning"></i></span>
                                <input type="text" name="title" value="{{ object.title }}" class="form-control border-0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Kategori</label>
                            <div class="input-group rounded-4 overflow-hidden shadow-sm">
                                <span class="input-group-text bg-white border-0"><i class="bi bi-tag text-warning"></i></span>
                                <input type="text" name="category" value="{{ object.category }}" class="form-control border-0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Deskripsi</label>
                            <textarea name="description" class="form-control" style="border-radius: 16px; border: 1px solid #e5e7eb;" rows="4" required>{{ object.description }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Lokasi</label>
                            <div class="input-group rounded-4 overflow-hidden shadow-sm">
                                <span class="input-group-text bg-white border-0"><i class="bi bi-geo-alt text-warning"></i></span>
                                <input type="text" name="location" value="{{ object.location }}" class="form-control border-0" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary fw-semibold">Status</label>
                            <select name="status" class="form-select" style="border-radius: 16px; border: 1px solid #e5e7eb;">
                                <option value="REPORTED" {% if object.status == 'REPORTED' %}selected{% endif %}>Dilaporkan</option>
                                <option value="VERIFIED" {% if object.status == 'VERIFIED' %}selected{% endif %}>Diverifikasi</option>
                                <option value="RESOLVED" {% if object.status == 'RESOLVED' %}selected{% endif %}>Diselesaikan</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-warning btn-lg w-100 rounded-pill mb-2">
                            <i class="bi bi-arrow-repeat me-2"></i>Update Laporan
                        </button>
                        <a href="/" class="btn btn-outline-secondary btn-lg w-100 rounded-pill">
                            <i class="bi bi-arrow-left me-2"></i>Kembali
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
