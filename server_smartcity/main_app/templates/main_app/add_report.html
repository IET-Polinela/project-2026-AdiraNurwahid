{% extends 'main_app/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-lg" style="border-radius: 24px; overflow: hidden;">
                <div class="p-4 text-white" style="background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);">
                    <div class="mb-3">
                        <i class="bi bi-plus-circle fs-1"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Tambah Laporan Baru</h2>
                    <p class="mb-0 opacity-75">Sampaikan masalah atau laporan kota kamu untuk diproses.</p>
                </div>
                <div class="p-5 bg-white">
                    <form method="post" onsubmit="this.querySelector('button[type=submit]').innerText='Loading...'; this.querySelector('button[type=submit]').disabled=true;">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Judul Laporan</label>
                            <div class="input-group rounded-4 overflow-hidden shadow-sm">
                                <span class="input-group-text bg-white border-0"><i class="bi bi-file-text text-primary"></i></span>
                                <input type="text" name="title" class="form-control border-0" placeholder="Apa masalahnya?" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Kategori</label>
                            <div class="input-group rounded-4 overflow-hidden shadow-sm">
                                <span class="input-group-text bg-white border-0"><i class="bi bi-tag text-primary"></i></span>
                                <input type="text" name="category" class="form-control border-0" placeholder="Jalan, Air, Sampah, dll" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Deskripsi Detail</label>
                            <textarea name="description" class="form-control" style="border-radius: 16px; border: 1px solid #e5e7eb;" rows="4" placeholder="Jelaskan kondisi atau masalah secara detail..." required></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary fw-semibold">Lokasi</label>
                            <div class="input-group rounded-4 overflow-hidden shadow-sm">
                                <span class="input-group-text bg-white border-0"><i class="bi bi-geo-alt text-primary"></i></span>
                                <input type="text" name="location" class="form-control border-0" placeholder="Alamat atau lokasi" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill mb-2">
                            <i class="bi bi-check-circle me-2"></i>Kirim Laporan
                        </button>
                        <a href="/" class="btn btn-outline-secondary btn-lg w-100 rounded-pill">
                            <i class="bi bi-arrow-left me-2"></i>Kembali
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
